@if (!authService.isLoggedIn()) {
  <app-login />
} @else {
  <header>
    <img src="/images/logo.jpg" alt="Logo" id="logo">
    <span>Gestion De Stock</span>
    <div class="div-head">
      <button style="background-color: #e69138; color:#ffffff; border-radius: 5px; border: none; padding: 3px; cursor: pointer;"
      (click)="logout()">Déconnexion</button>

      <a href="#"><img src="/images/notif.png"></a>
      <a href="#"><img src="/images/setting.png"></a>
      <a href="#"><img src="/images/profil.png"></a>
    </div>
  </header>

  <aside>
    <div>
      <input type="text" placeholder="Rechercher...">
      <a routerLink="/dashboard"   routerLinkActive="active" class="aside-link"><img src="/images/idashboard.png"><button>Dashboard</button></a>
      <a routerLink="/stock"       routerLinkActive="active" class="aside-link"><img src="/images/istock.png"><button>Stock</button></a>
      <a routerLink="/ventes"      routerLinkActive="active" class="aside-link"><img src="/images/iventes.png"><button>Ventes</button></a>
      <a routerLink="/commandes"   routerLinkActive="active" class="aside-link"><img src="/images/icommandes.png"><button>Commandes</button></a>
      <a routerLink="/fournisseur" routerLinkActive="active" class="aside-link"><img src="/images/ifournisseurs.png"><button>Fournisseurs</button></a>
      <a routerLink="/a-propos"    routerLinkActive="active" class="aside-link"><img src="/images/ia_propos.png"><button>A Propos</button></a>
    </div>
    <a id="order" routerLink="/new-order">
      <button>
        <img src="/images/order.png" style="width:40px;height:40px;"><br>
        <span style="font-size:large;">New Order</span>
      </button>
    </a>
    <footer>©2026 Supermarket</footer>
  </aside>

  <main>
    <router-outlet />
  </main>
}
