<div class="fournisseur">
  <section class="fournisseur-title">
    <h1>Nos Fournisseurs</h1>
    <h3>Liste des fournisseurs du supermarché</h3>
  </section>

  <section class="fournisseur-list">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Societe</th>
          <th>Contact</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (fournisseur of fournisseurs(); track fournisseur.id) {
          <tr>
            <td>{{ fournisseur.societe }}</td>
            <td>{{ fournisseur.contact }}</td>
            <td><button class="but-four">Commander</button></td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
