<div class="stock">
  <section class="stock-title">
    <h1>Inventaire</h1>
    <h3>Rapport de stock en temps réel.</h3>
  </section>

  <section class="stock-list">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Designation des produits</th>
          <th>Categorie</th>
          <th>Stock</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        @for (produit of produits(); track produit.id) {
          <tr>
            <td>{{ produit.libelle }}</td>
            <td>{{ produit.prix_unitaire }}</td>
            <td>{{ produit.quantite }}</td>
            <td>{{ produit.seuil_alert }}</td>
          </tr>
        }
      </tbody>
    </table>
  </section>
</div>
