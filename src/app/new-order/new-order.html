<div class="norder container">
  <section class="norder-title">
    <h1>Commandes Clients</h1>
    <h3>Gestion des commandes du supermarché.</h3>
    <!-- <h3>Gestion des commandes depuis le fournisseur.</h3> -->

  </section>

  <div class="row border">
    <section class="norder-list col-sm-8 d-flex flex-wrap gap-3">
      @for (item of produits; track $index) {
      <div class="card" style="max-width: 12rem;height: auto;">
        <img style="border: #f1f1f1 solid 0.5px;" src="/images/poutre.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">{{item.name}}</h5>
          <p class="card-text">{{item.description}}</p>
          <div class="d-flex justify-content-between align-items-center">
            <p style="color: #e69138;">{{price}} FCFA</p>
            <a href="#" class="btn btn-primary"><img src="/images/plus.png" alt="add"></a></div>
          </div>
      </div>
      }
    </section>
    <section class="norder-facture col-sm-4 border d-flex flex-column gap-3">
      <ul class="list-group">
        @for (item of produits; track $index) {
        <li class="list-group-item">{{item.name}}</li>}
      </ul>
      <button class="btn btn-primary" type="button">Generer Facture</button>
    </section>
  </div>
</div>
